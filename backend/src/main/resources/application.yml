server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-stacktrace: never

spring:
  application:
    name: adsphere
  datasource:
    # In-memory H2 by default. For a persistent/production database set
    # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (and add the JDBC driver dependency).
    url: ${DB_URL:jdbc:h2:mem:adsphere;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Development default only. Always override APP_JWT_SECRET outside local development.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
